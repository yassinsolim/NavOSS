version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: America/Edmonton
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Major versions need a deliberate upgrade with native builds and device testing.
      # This also keeps @types/node on the pinned Node major (.node-version / engines).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The Expo SDK pins these to tested versions. Move them with `npx expo install --fix` or an
      # SDK upgrade, never independently: e.g. React Native 0.87 is not supported by Expo SDK 57.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
