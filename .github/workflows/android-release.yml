name: Android release

# Builds the signed arm64-v8a release APK on a GitHub-hosted runner and attaches it, with its
# SHA-256 and update.json, to a GitHub release tagged android-v<versionName>-<versionCode>.
# Manual dispatch only. Releases are drafts unless `publish` is chosen; the app's updater sees
# published releases only. See docs/release/android.md.
#
# Version code: 100 + this workflow's run number. Run numbers only grow for a workflow file, and
# a re-run keeps its number (and so rebuilds the same version). 1-100 stay free for local builds.
# Renaming this file would restart run numbers, so the release job also refuses any version code
# not above every existing android-v release, drafts included.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (the app offers it to everyone). Leave off for a draft.
        required: false
        default: false
        type: boolean
      notes:
        description: Short release notes (one or two sentences).
        required: false
        default: ''
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # SHA-256 of the NavOSS release signing certificate (public; also in docs/release/android.md
  # and the updater's verification).
  NAVOSS_RELEASE_CERT_SHA256: b863f22e50bc259c5650c5838c7ae06cacff74daf0ac36668983a49c776c9fb7
  VERSION_CODE_OFFSET: '100'

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    outputs:
      version-code: ${{ steps.version.outputs.version-code }}
      version-name: ${{ steps.version.outputs.version-name }}
      tag: ${{ steps.version.outputs.tag }}
      core-sha256: ${{ steps.core.outputs.core-sha256 }}
      core-contract-version: ${{ steps.core.outputs.contract-version }}
    env:
      # The production origin is public, not a secret.
      EXPO_PUBLIC_API_URL: https://navoss-api.yassin.app
    steps:
      # Releases come from main only (docs/release/android.md).
      - name: Refuse a ref other than main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Android releases are built from main only, not $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # A bounded answer list on a here-string: `yes | sdkmanager` ends `yes` with SIGPIPE, which
          # pipefail turns into a failed step. sdkmanager's own exit status still decides.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null \
            <<<"$(printf 'y\n%.0s' {1..64})"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' >/dev/null

      - name: Choose version
        id: version
        run: |
          set -euo pipefail
          version_name="$(node -p "require('./apps/mobile/app.json').expo.version")"
          version_code="$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))"
          tag="android-v${version_name}-${version_code}"
          {
            echo "version-name=$version_name"
            echo "version-code=$version_code"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag"

      # A test build points the updater at a fake endpoint and allows cleartext to 127.0.0.1.
      - name: Refuse test-only configuration
        run: |
          if [ -n "${EXPO_PUBLIC_NAVOSS_UPDATE_FEED_URL:-}" ]; then
            echo 'EXPO_PUBLIC_NAVOSS_UPDATE_FEED_URL is for local test builds only.' >&2
            exit 1
          fi

      # The Swift navigation core, always compiled from source here (never from the library
      # cache: the build is not reproducible and a cached library would be signed unseen) and
      # verified, before the keystore exists: every download, install and native build of the core
      # runs without the key on disk. Shared with ci.yml; any failed check stops the release.
      # See docs/architecture/android-core.md.
      - name: Build the Android navigation core
        id: core
        uses: ./.github/actions/build-android-core
        with:
          library-cache: 'false'

      # Everything that can run without the key runs here: release configuration check,
      # contracts build, expo prebuild, the Gradle wrapper pinned to gradle.org's checksum, and a
      # full assembleRelease signed with a throwaway key (deleted with its APK), which downloads
      # the Gradle distribution and every dependency and builds the bundle, R8 output, resources
      # and native libraries.
      - name: Prepare the release build (no key)
        env:
          NAVOSS_ANDROID_VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: apps/mobile/scripts/build-android-release.sh prepare

      # The keystore exists only for the next step and is removed right after it.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Configure ANDROID_KEYSTORE_BASE64 in the android-release environment.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navoss-release.p12"

      - name: Sign and package the release APK (offline)
        env:
          NAVOSS_ANDROID_KEYSTORE: ${{ runner.temp }}/navoss-release.p12
          NAVOSS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NAVOSS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NAVOSS_ANDROID_VERSION_CODE: ${{ steps.version.outputs.version-code }}
        # Offline: nothing is downloaded while the key is on disk. Only the signing and packaging
        # tasks run (the script lists them and fails on any other).
        run: |
          set -euo pipefail
          apps/mobile/scripts/build-android-release.sh sign 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/navoss-release.p12"

      # GitHub masks secret values in its own log, but the uploaded build log and any artifact
      # would not be. Fail if anything key-like reached the build output. The secrets are in this
      # step's environment only to be compared: the step runs nothing but grep on the log, after
      # the keystore is deleted, and passes them as patterns on a file descriptor (`printf` is a
      # shell builtin), never on a command line other processes could read.
      - name: Scan build log for key material
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"
          status=0
          if grep -Eq -- '-----BEGIN [A-Z ]*(PRIVATE KEY|CERTIFICATE)-----' "$log"; then
            echo 'PEM key material in the build log' >&2; status=1
          fi
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ] &&
            grep -qF -f <(printf '%s\n' "$ANDROID_KEYSTORE_PASSWORD") -- "$log"; then
            echo 'Keystore password in the build log' >&2; status=1
          fi
          if grep -qF -f <(printf '%s\n' "${ANDROID_KEYSTORE_BASE64:0:48}") -- "$log"; then
            echo 'Encoded keystore in the build log' >&2; status=1
          fi
          if grep -Eq '[A-Za-z0-9+/]{200,}={0,2}' "$log"; then
            echo 'Long base64 run in the build log' >&2; status=1
          fi
          exit $status

      - name: Verify APK
        id: verify
        env:
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/36.0.0"
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          certs="$("$bt/apksigner" verify --print-certs "$apk")"
          grep -E 'certificate (DN|SHA-256)' <<<"$certs"
          if [ "$(grep -c 'certificate SHA-256 digest' <<<"$certs")" -ne 1 ] || \
             ! grep -q "certificate SHA-256 digest: $NAVOSS_RELEASE_CERT_SHA256" <<<"$certs"; then
            echo 'APK is not signed by exactly the pinned NavOSS release certificate' >&2
            exit 1
          fi
          badging="$("$bt/aapt2" dump badging "$apk")"
          grep -q "package: name='org.navoss.mobile' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging" || {
            echo 'Unexpected package, version code or version name' >&2; exit 1; }
          manifest="$("$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk")"
          if grep -q 'debuggable(0x0101000f)=true' <<<"$manifest"; then
            echo 'Release APK is debuggable' >&2; exit 1
          fi
          if ! grep -q 'usesCleartextTraffic(0x010104ec)=false' <<<"$manifest" || \
             grep -q networkSecurityConfig <<<"$manifest"; then
            echo 'Release APK allows cleartext traffic' >&2; exit 1
          fi
          abis="$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          if [ "$abis" != 'arm64-v8a ' ]; then
            echo "Unexpected native ABIs: $abis" >&2; exit 1
          fi
          # Hermes bytecode starts with the magic 0x1F1903C103BC1FC6 (little-endian). Extract to a
          # file first: `unzip -p | head -c 8` ends unzip with SIGPIPE, which pipefail fails on.
          # Searches below read here-strings for the same reason (`echo | grep -q` can hide a match).
          bundle="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$apk" assets/index.android.bundle >"$bundle"
          magic="$(head -c 8 "$bundle" | od -An -tx1 | tr -d ' \n')"
          if [ "$magic" != c61fbc03c103191f ]; then
            echo 'JavaScript bundle is not Hermes bytecode' >&2; exit 1
          fi
          # The navigation core, byte for byte as verified (NDK r30's libc++_shared.so with it),
          # and every class and member JNI reaches kept under its name by R8.
          apps/mobile/modules/navoss-navigation/android-core/scripts/verify-apk-core.sh "$apk"
          min_sdk="$(echo "$badging" | sed -n "s/^minSdkVersion:'\([0-9]*\)'/\1/p")"
          echo "min-sdk=$min_sdk" >> "$GITHUB_OUTPUT"
          echo "Verified $(du -h "$apk" | cut -f1) APK, minSdk $min_sdk"

      - name: Prepare release assets
        env:
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          MIN_SDK: ${{ steps.verify.outputs.min-sdk }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          name="navoss-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$out/$name"
          (cd "$out" && sha256sum "$name" > "$name.sha256")
          NAME="$name" SHA256="$(cut -d' ' -f1 "$out/$name.sha256")" SIZE="$(stat -c %s "$out/$name")" \
            node -e '
              const e = process.env;
              const update = {
                versionCode: Number(e.VERSION_CODE),
                versionName: e.VERSION_NAME,
                minSdk: Number(e.MIN_SDK),
                apk: e.NAME,
                sha256: e.SHA256,
                size: Number(e.SIZE),
                notes: e.NOTES.slice(0, 500),
              };
              require("node:fs").writeFileSync(process.argv[1], JSON.stringify(update, null, 2) + "\n");
            ' "$out/update.json"
          cat "$out/update.json"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      CORE_SHA256: ${{ needs.build.outputs.core-sha256 }}
      CORE_CONTRACT: ${{ needs.build.outputs.core-contract-version }}
      PUBLISH: ${{ inputs.publish }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release

      - name: Refuse a version code that does not increase
        run: |
          set -euo pipefail
          highest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name | select(startswith("android-v")) | capture("-(?<code>[0-9]+)$").code' \
            | sort -n | tail -1)"
          if [ -n "$highest" ] && [ "$VERSION_CODE" -le "$highest" ]; then
            echo "Version code $VERSION_CODE is not above the highest released $highest" >&2
            exit 1
          fi

      - name: Create release
        run: |
          set -euo pipefail
          apk="navoss-${VERSION_NAME}-${VERSION_CODE}.apk"
          body="${NOTES:-NavOSS for Android, technical beta.}

          SHA-256 of $apk: $(cut -d' ' -f1 "release/$apk.sha256")
          Signing certificate SHA-256: $NAVOSS_RELEASE_CERT_SHA256
          Navigation core: contract v$CORE_CONTRACT, libNavOSSCore.so SHA-256 $CORE_SHA256
          How to verify and install: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/release/android.md"
          draft=--draft
          if [ "$PUBLISH" = true ]; then draft=''; fi
          gh release create "$TAG" $draft \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NavOSS for Android $VERSION_NAME ($VERSION_CODE)" \
            --notes "$body" \
            "release/$apk" "release/$apk.sha256" release/update.json

      # The app trusts the digest GitHub reports for the asset. Check it equals the build's own.
      - name: Check GitHub's asset digest
        run: |
          set -euo pipefail
          apk="navoss-${VERSION_NAME}-${VERSION_CODE}.apk"
          expected="sha256:$(cut -d' ' -f1 "release/$apk.sha256")"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"$apk\") | .digest")"
          if [ "$actual" != "$expected" ]; then
            echo "GitHub reports $actual for $apk, expected $expected" >&2
            exit 1
          fi
          echo "Release $TAG ready ($([ "$PUBLISH" = true ] && echo published || echo draft))"
