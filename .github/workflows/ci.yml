name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostGIS for the database suites (community reports and traffic). They create and drop their
    # own schemas and databases, so one throwaway server serves both.
    services:
      postgis:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: navoss
          POSTGRES_PASSWORD: navoss
          POSTGRES_USER: navoss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navoss -d navoss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check third-party notices
        run: |
          corepack pnpm licenses:generate
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Type-check
        run: corepack pnpm check

      - name: Lint
        run: corepack pnpm lint

      # The routing-input filter test runs the real osmium.
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool

      - name: Test
        run: corepack pnpm test
        env:
          # Fail instead of skipping when osmium or the database is unavailable.
          NAVOSS_REQUIRE_OSMIUM: '1'
          NAVOSS_REQUIRE_TEST_DATABASE: '1'
          NAVOSS_TEST_DATABASE_URL: postgres://navoss:navoss@127.0.0.1:5432/navoss
          NAVOSS_TRAFFIC_TEST_DATABASE_URL: postgres://navoss:navoss@127.0.0.1:5432/navoss

      # The Swift doc comment for the splice lookback quotes this script's numbers. Running it here
      # keeps those numbers executable instead of a claim that drifts away from the code.
      - name: Check the CarPlay splice control
        run: corepack pnpm --filter @navoss/mobile test:carplay-splice

      - name: Build
        run: corepack pnpm build

      - name: Check patch integrity
        run: git diff --check

  native-ios:
    name: Native iOS core
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test Swift navigation core
        run: swift test --package-path apps/mobile/modules/navoss-navigation

  carplay-generated-sources:
    name: CarPlay generated sources
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # `apps/mobile/ios` is generated and gitignored, so this cannot be a `git diff`. Regenerate
      # it and compare the copies the config plugin made against the sources they came from.
      - name: Regenerate the iOS project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ci.invalid
          NAVOSS_CARPLAY_ENABLED: '1'
          NAVOSS_CARPLAY_ENTITLEMENT_ENABLED: '1'
        run: corepack pnpm exec expo prebuild --platform ios --no-install

      # The offline routing engine is fetched by the NavOSSNavigation podspec during `pod install`
      # (not run above). Check the pinned, SHA-256-verified download still resolves.
      - name: Verify the pinned offline routing engine
        run: ruby apps/mobile/modules/navoss-navigation/ios/valhalla_mobile.rb

      # The plugin copies `apps/mobile/carplay/ios/*.swift` into the generated project. Editing a
      # source without regenerating silently builds the previous copy, which has shipped stale
      # CarPlay code more than once. Fail loudly instead.
      - name: Verify copied CarPlay sources match their originals
        working-directory: apps/mobile
        run: |
          status=0
          for source in carplay/ios/*.swift; do
            generated="ios/NavOSS/$(basename "$source")"
            if [ ! -f "$generated" ]; then
              echo "::error file=$source::not copied into the generated project"
              status=1
            elif ! diff -q "$source" "$generated" >/dev/null; then
              echo "::error file=$source::generated copy differs from source"
              diff -u "$source" "$generated" || true
              status=1
            fi
          done
          for generated in ios/NavOSS/*.swift; do
            name="$(basename "$generated")"
            if [ ! -f "carplay/ios/$name" ] && grep -q "NavOSSCarPlay\|NavOSSPhoneSceneDelegate\|NavOSSNavigationIntents" <<<"$name"; then
              echo "::error file=$generated::generated CarPlay source has no original in carplay/ios"
              status=1
            fi
          done
          exit $status

      # The scenes the copied sources implement must be declared, or the delegates never run.
      - name: Verify CarPlay scene declarations
        working-directory: apps/mobile
        run: |
          plist=ios/NavOSS/Info.plist
          for key in CPSupportsDashboardNavigationScene CPSupportsInstrumentClusterNavigationScene; do
            value="$(/usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:$key" "$plist")"
            if [ "$value" != "true" ]; then
              echo "::error::$key is not true in the generated Info.plist"
              exit 1
            fi
          done
          for role in CPTemplateApplicationSceneSessionRoleApplication CPTemplateApplicationDashboardSceneSessionRoleApplication CPTemplateApplicationInstrumentClusterSceneSessionRoleApplication; do
            /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:$role:0:UISceneDelegateClassName" "$plist"
          done

  # Two legs side by side: `debug` (debug APK and the Kotlin unit tests) and `release` (the R8 and
  # resource-shrinking build). Each also builds or restores the navigation core and checks its APK.
  # One job doing both took about 20 minutes, mostly compiling React Native's C++ twice.
  android:
    name: Android build and Kotlin tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      # The navigation plugin requires an HTTPS API origin; CI never calls it.
      EXPO_PUBLIC_API_URL: https://ci.invalid
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests build Android only when they touch something the Android app is made from;
      # pushes to main and manual runs always build. The job runs beside the others, never before.
      - name: Decide whether Android is affected
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          # `modules/` covers the navigation core's sources (ios/Core, android-core).
          if grep -Eq '^(apps/mobile/(app\.json|package\.json|babel\.config\.js|metro\.config\.js|plugins/|modules/|src/|assets/|scripts/(build-android-core\.sh|android-core-toolchain\.env|build-android-release\.sh|pin-gradle-wrapper\.sh|gradle-wrapper\.env|validate-release-env\.mjs))|packages/contracts/|pnpm-lock\.yaml|\.github/workflows/ci\.yml|\.github/actions/build-android-core/)' <<<"$changed"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
            echo 'No Android-relevant changes; skipping the Android build.'
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up JDK 17
        if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        if: steps.changes.outputs.android == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/plugins/*.cjs', 'apps/mobile/modules/*/android/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-${{ matrix.variant }}-

      - name: Enable pnpm
        if: steps.changes.outputs.android == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.android == 'true'
        run: corepack pnpm install --frozen-lockfile

      - name: Install Android SDK packages
        if: steps.changes.outputs.android == 'true'
        run: |
          set -euo pipefail
          # A bounded answer list on a here-string: `yes | sdkmanager` ends `yes` with SIGPIPE, which
          # pipefail turns into a failed step. sdkmanager's own exit status still decides.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null \
            <<<"$(printf 'y\n%.0s' {1..64})"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' >/dev/null

      # The Swift navigation core, built (or restored and re-verified) exactly as the release
      # workflow does, so the APKs below package it.
      - name: Build the Android navigation core
        if: steps.changes.outputs.android == 'true'
        id: core
        uses: ./.github/actions/build-android-core

      - name: Build the debug APK and run Kotlin unit tests
        if: steps.changes.outputs.android == 'true' && matrix.variant == 'debug'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          corepack pnpm --filter @navoss/contracts build
          corepack pnpm exec expo prebuild --platform android --clean --no-install
          scripts/pin-gradle-wrapper.sh android
          cd android
          ./gradlew --console=plain :app:assembleDebug \
            :navoss-updater:testDebugUnitTest :navoss-navigation:testDebugUnitTest

      # The release leg runs the release workflow's own two phases (build-android-release.sh), so
      # R8 and resource shrinking run on every change and the claim that only signing and
      # packaging happen while the key is present is tested here. Both keys are throwaway ones
      # generated on the runner: the release signing plugin accepts any keystore named by its
      # three variables; the release workflow is what pins the certificate.
      - name: Prepare the release build (no key)
        if: steps.changes.outputs.android == 'true' && matrix.variant == 'release'
        run: apps/mobile/scripts/build-android-release.sh prepare

      - name: Create a throwaway signing key
        if: steps.changes.outputs.android == 'true' && matrix.variant == 'release'
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          keytool -genkeypair -storetype pkcs12 -keystore "$RUNNER_TEMP/ci-throwaway.p12" \
            -storepass "$password" -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=NavOSS CI throwaway' >/dev/null 2>&1
          {
            echo "NAVOSS_ANDROID_KEYSTORE=$RUNNER_TEMP/ci-throwaway.p12"
            echo "NAVOSS_ANDROID_KEYSTORE_PASSWORD=$password"
            echo 'NAVOSS_ANDROID_KEY_ALIAS=ci-throwaway'
          } >> "$GITHUB_ENV"

      - name: Sign and package the release APK (offline)
        if: steps.changes.outputs.android == 'true' && matrix.variant == 'release'
        run: apps/mobile/scripts/build-android-release.sh sign

      # The APK carries the verified libraries byte for byte (so NDK r30's libc++_shared.so), and
      # its dex keeps every class and member JNI reaches by name (in release: R8 did not strip them).
      - name: Verify the navigation core in the APK
        if: steps.changes.outputs.android == 'true'
        run: |
          set -euo pipefail
          apps/mobile/modules/navoss-navigation/android-core/scripts/verify-apk-core.sh \
            "apps/mobile/android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
