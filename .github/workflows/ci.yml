name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check third-party notices
        run: |
          corepack pnpm licenses:generate
          git diff --exit-code -- THIRD_PARTY_NOTICES.md

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Type-check
        run: corepack pnpm check

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      # The Swift doc comment for the splice lookback quotes this script's numbers. Running it here
      # keeps those numbers executable instead of a claim that drifts away from the code.
      - name: Check the CarPlay splice control
        run: corepack pnpm --filter @navoss/mobile test:carplay-splice

      - name: Build
        run: corepack pnpm build

      - name: Check patch integrity
        run: git diff --check

  native-ios:
    name: Native iOS core
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test Swift navigation core
        run: swift test --package-path apps/mobile/modules/navoss-navigation

  carplay-generated-sources:
    name: CarPlay generated sources
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # `apps/mobile/ios` is generated and gitignored, so this cannot be a `git diff`. Regenerate
      # it and compare the copies the config plugin made against the sources they came from.
      - name: Regenerate the iOS project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ci.invalid
          NAVOSS_CARPLAY_ENABLED: '1'
          NAVOSS_CARPLAY_ENTITLEMENT_ENABLED: '1'
        run: corepack pnpm exec expo prebuild --platform ios --no-install

      # The offline routing engine is fetched by the NavOSSNavigation podspec during `pod install`
      # (not run above). Check the pinned, SHA-256-verified download still resolves.
      - name: Verify the pinned offline routing engine
        run: ruby apps/mobile/modules/navoss-navigation/ios/valhalla_mobile.rb

      # The plugin copies `apps/mobile/carplay/ios/*.swift` into the generated project. Editing a
      # source without regenerating silently builds the previous copy, which has shipped stale
      # CarPlay code more than once. Fail loudly instead.
      - name: Verify copied CarPlay sources match their originals
        working-directory: apps/mobile
        run: |
          status=0
          for source in carplay/ios/*.swift; do
            generated="ios/NavOSS/$(basename "$source")"
            if [ ! -f "$generated" ]; then
              echo "::error file=$source::not copied into the generated project"
              status=1
            elif ! diff -q "$source" "$generated" >/dev/null; then
              echo "::error file=$source::generated copy differs from source"
              diff -u "$source" "$generated" || true
              status=1
            fi
          done
          for generated in ios/NavOSS/*.swift; do
            name="$(basename "$generated")"
            if [ ! -f "carplay/ios/$name" ] && grep -q "NavOSSCarPlay\|NavOSSPhoneSceneDelegate\|NavOSSNavigationIntents" <<<"$name"; then
              echo "::error file=$generated::generated CarPlay source has no original in carplay/ios"
              status=1
            fi
          done
          exit $status

      # The scenes the copied sources implement must be declared, or the delegates never run.
      - name: Verify CarPlay scene declarations
        working-directory: apps/mobile
        run: |
          plist=ios/NavOSS/Info.plist
          for key in CPSupportsDashboardNavigationScene CPSupportsInstrumentClusterNavigationScene; do
            value="$(/usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:$key" "$plist")"
            if [ "$value" != "true" ]; then
              echo "::error::$key is not true in the generated Info.plist"
              exit 1
            fi
          done
          for role in CPTemplateApplicationSceneSessionRoleApplication CPTemplateApplicationDashboardSceneSessionRoleApplication CPTemplateApplicationInstrumentClusterSceneSessionRoleApplication; do
            /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest:UISceneConfigurations:$role:0:UISceneDelegateClassName" "$plist"
          done
