name: Automated PR review

# A second agent reviews every pull request the moment it is ready, so implementation and review
# are never done by the same reasoning. The review is advisory: it posts findings and never fails
# the build, because CI already owns the objective gates and a reviewer that blocks on judgement
# calls would stall the queue.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Review pull request
    # Drafts are still being written, and Dependabot PRs are mechanical version bumps whose risk is
    # covered by the lockfile and CI rather than by reading the diff.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A hard failure here would paint every pull request red until the secret exists, which
      # teaches people to ignore the check. Warn once, visibly, and skip instead.
      - name: Check for Anthropic API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo '::warning::Automated review skipped. Add ANTHROPIC_API_KEY to repository secrets to enable it.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for NavOSS, a privacy-first iOS and CarPlay navigation
            app. The PR branch is already checked out. Read `AGENTS.md` for project conventions
            before you start.

            Your value is catching what the author's own reasoning missed. Be specific and
            evidence-based. Do not cheerlead, do not summarise the diff back, and do not raise
            hypotheticals you have not grounded in the code you just read.

            ## Check these first, in order

            **1. Claims that were never executed.** Compare the PR description against evidence.
            If it says a suite passes, a build compiles, or behaviour was verified, look for
            something that could only be true if it actually ran. Navigation bugs have shipped here
            because a plausible claim went unchecked. Flag any claim of verification that the diff
            or CI cannot support, and say precisely which claim.

            **2. Tests that assert source text instead of behaviour.** This repository has a
            documented history of it, tracked in issue #23. A test that reads a `.swift` or `.tsx`
            file and asserts a substring is usually pinning formatting, and has more than once
            pinned a bug as if it were correct. `distanceInterval: 25` was asserted as intended
            while it was the defect being reported. Source assertions are acceptable only for
            build-time packaging invariants that cannot be exercised at runtime.

            **3. Tests that cannot fail.** For each new test, ask what change to the production
            code would make it fail. If you cannot name one, say so. A test that passes against
            both the fix and the bug is worse than no test, because it manufactures confidence.

            **4. Safety and privacy, from `AGENTS.md`.** Never invent route, traffic, closure,
            camera, place, or safety data; fail conservatively instead. Never log search text,
            route coordinates, raw location, or trip history. Do not let the diff claim live
            traffic, traffic-aware ETA, lane guidance, or offline routing unless it genuinely adds
            and validates them.

            **5. CarPlay specifics.** Sources in `apps/mobile/carplay/ios` are copied into the
            generated project; editing one without regenerating silently ships the previous copy.
            The CarPlay entitlement is build-time gated and Core Simulator strips it, so simulator
            evidence cannot establish that a real head unit works. Treat any claim of verified
            CarPlay interaction without device evidence as unproven.

            **6. Clean cutover.** Migrated callers, no leftover shims, aliases, dead code, or a
            second implementation living beside the one under test.

            ## How to report

            Use `mcp__github_inline_comment__create_inline_comment` with `confirmed: true` for
            findings tied to specific lines. Use `gh pr comment` once for the summary.

            Open the summary with a one-line verdict on its own line, exactly one of:

            `VERDICT: approve` - no blocking findings.
            `VERDICT: comment` - worth addressing, not blocking.
            `VERDICT: request-changes` - a correctness, safety, privacy, or false-verification
            problem that should be fixed before merge.

            Then list findings, most serious first, each with the file and line and why it matters.
            If you find nothing of substance, say that plainly in two sentences rather than padding
            the review. Reporting a clean diff accurately is a useful result.

            Post only GitHub comments. Do not return the review as a chat message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
