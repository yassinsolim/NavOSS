appId: org.navoss.mobile
---
- launchApp:
    clearState: true
- openLink: 'exp+navoss://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- waitForAnimationToEnd
- tapOn:
    text: 'Close'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- tapOn:
    text: 'Allow While Using App'
    optional: true
- tapOn:
    text: 'Allow'
    optional: true
- extendedWaitUntil:
    visible: 'Search Calgary'
    timeout: 20000
- tapOn: 'Search Calgary'
- eraseText
- inputText: 'Airport'
- extendedWaitUntil:
    visible: 'Select Calgary International Airport.*, [0-9.]+ (m|km) away,.*'
    timeout: 20000
- assertNotVisible: 'Current location unavailable'
