appId: org.navoss.mobile
---
- launchApp:
    clearState: true
- openLink: 'exp+navoss://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- waitForAnimationToEnd
- tapOn:
    text: 'Close'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- extendedWaitUntil:
    visible: 'Search Calgary'
    timeout: 20000
- tapOn: 'Search Calgary'
- eraseText
- inputText: 'Airport'
- extendedWaitUntil:
    visible: 'Select Calgary International Airport.*'
    timeout: 20000
- tapOn: 'Select Calgary International Airport.*'
- extendedWaitUntil:
    visible: 'Directions'
    timeout: 10000
- tapOn: 'Directions'
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
- assertVisible: 'Route preview'
- takeScreenshot: '/tmp/navoss-validation-phone-preview'
- tapOn: 'Start navigation'
- extendedWaitUntil:
    visible: 'End navigation'
    timeout: 20000
- assertVisible: 'Share ETA'
- takeScreenshot: '/tmp/navoss-validation-phone-guidance'
- tapOn: 'Report road condition'
- assertVisible: 'Report Slow traffic'
- assertVisible: 'Report Construction'
- assertVisible: 'Report Pothole'
- assertVisible: 'Report Object on road'
- assertVisible: 'Report Other hazard'
- assertVisible: '.*not shown to other drivers yet.*'
- takeScreenshot: '/tmp/navoss-validation-phone-report'
- tapOn: 'Cancel report'
- tapOn: 'End navigation'
- assertVisible: 'Route preview'
