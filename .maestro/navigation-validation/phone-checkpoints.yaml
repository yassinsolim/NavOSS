appId: org.navoss.mobile
---
- openLink: 'exp+navoss://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Open|Bundling.*|Search places|Close|Continue'
    timeout: 10000
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    notVisible: 'Bundling.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn:
          point: '95%,7%'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn:
          point: '95%,7%'
- tapOn:
    text: 'Reload'
    optional: true
- extendedWaitUntil:
    visible: 'Continue|Search places'
    timeout: 20000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn:
          point: '95%,7%'
- extendedWaitUntil:
    visible: 'Search places'
    timeout: 20000
- tapOn: 'Search places'
- eraseText
- inputText: 'Airport'
- extendedWaitUntil:
    visible: 'Select Calgary International Airport.*'
    timeout: 20000
- tapOn: 'Select Calgary International Airport.*'
- extendedWaitUntil:
    visible: 'Directions'
    timeout: 10000
- tapOn: 'Directions'
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
- assertVisible: 'Route preview'
- tapOn: 'Edit route stops'
- assertVisible: 'Edit stops'
- assertVisible: 'My location'
- assertVisible: 'Calgary International Airport'
- tapOn: 'Search for a stop'
- inputText: 'Central Library'
- tapOn: 'Search stops'
- extendedWaitUntil:
    visible: 'Add Central Library as a stop'
    timeout: 20000
- tapOn: 'Add Central Library as a stop'
- assertVisible: 'Move Central Library up'
- tapOn: 'Move Central Library up'
- tapOn: 'Apply route stops'
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
- assertVisible: 'Edit route stops'
- takeScreenshot: '/tmp/navoss-validation-phone-preview'
- tapOn: 'Start navigation'
- extendedWaitUntil:
    visible: 'End navigation'
    timeout: 20000
- assertVisible: 'Share ETA'
- takeScreenshot: '/tmp/navoss-validation-phone-guidance'
- tapOn: 'Report road condition'
- assertVisible: 'Report Crash'
- assertVisible: 'Report Road closed'
- assertVisible: 'Report Slow traffic'
- assertVisible: 'Report Construction'
- assertVisible: 'Report Pothole'
- assertVisible: 'Report Object on road'
- assertVisible: 'Report Other hazard'
- assertVisible: 'Report Stopped vehicle'
- assertVisible: '.*not shown to other drivers yet.*'
- takeScreenshot: '/tmp/navoss-validation-phone-report'
- tapOn: 'Cancel report'
- tapOn: 'End navigation'
- assertVisible: 'Route preview'
