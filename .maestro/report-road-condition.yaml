appId: org.navoss.mobile
---
- launchApp:
    clearState: true
- openLink: 'exp+navoss://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- waitForAnimationToEnd
- tapOn:
    text: 'Close'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- extendedWaitUntil:
    visible: 'Search places'
    timeout: 20000
- longPressOn:
    point: 78%,45%
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
- assertVisible: 'Dropped pin'
- tapOn: 'Start navigation'
- assertVisible: 'Report road condition'
- tapOn: 'Report road condition'
- assertVisible: 'What did you pass?'
- assertVisible: 'Report Crash'
- assertVisible: 'Report Road closed'
- assertVisible: 'Report Slow traffic'
- assertVisible: 'Report Construction'
- assertVisible: 'Report Pothole'
- assertVisible: 'Report Object on road'
- assertVisible: 'Report Other hazard'
- assertVisible: 'Report Stopped vehicle'
# A fresh install never shares: "Share road reports" is off, so the report is a private draft
# whether or not the server offers community reports.
- assertVisible: '(?i).*saved privately on this iPhone for two hours and not shown to other drivers.*'
- tapOn: 'Report Construction'
- assertVisible: 'Saved privately'
- assertVisible: 'Saved privately on this iPhone for two hours and not shown to other drivers.*'
- assertVisible: 'End navigation'
- tapOn: 'End navigation'
- extendedWaitUntil:
    visible: 'Search places'
    timeout: 10000
