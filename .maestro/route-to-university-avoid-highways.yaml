appId: org.navoss.mobile
---
- launchApp
- tapOn: 'Search places'
- eraseText
- inputText: 'University'
# Results are nearest first, so a distant match can start below the keyboard.
- scrollUntilVisible:
    element: 'Select University of Calgary.*'
    direction: DOWN
- assertVisible: 'Select University of Calgary.*'
- tapOn: 'Select University of Calgary.*'
- extendedWaitUntil:
    visible: 'Directions'
    timeout: 10000
- tapOn: 'Directions'
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
# Avoidances sit above the preview sheet's resting detent.
- swipe:
    start: 50%, 60%
    end: 50%, 25%
    duration: 400
- waitForAnimationToEnd
- tapOn: 'Avoid highways'
- extendedWaitUntil:
    visible: 'Start navigation'
    timeout: 20000
- assertVisible: 'Avoid highways'
- assertVisible: 'No live traffic'
- assertVisible: 'Select .* route, 8.2 km, via Memorial Drive NW / University Drive NW'
