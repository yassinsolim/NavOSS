name: TestFlight distribution

# Manual only. Assigning a build to the external `NavOSS Friends` group and submitting it for
# Beta App Review is a deliberate maintainer decision, not a side effect of an upload: an upload
# alone reaches only the internal `testers` group, which Apple distributes to automatically.
# The earlier `app_store_connect.build_upload` trigger was removed for that reason; see
# docs/release/ci-cd.md.
#
#   eas workflow:run .eas/workflows/testflight-distribute.yml \
#     -F asc_build_id=<id> -F changelog="..."

on:
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: App Store Connect build id to distribute.
      changelog:
        type: string
        required: true
        description: What to Test notes shown to TestFlight testers.
      submit_beta_review:
        type: boolean
        default: true
        description: Submit new builds for Beta App Review; disable for an already approved build.

jobs:
  distribute:
    name: Distribute to NavOSS Friends
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id }}
      # The internal `testers` group already has automatic distribution enabled in Apple.
      external_groups:
        - NavOSS Friends
      changelog: ${{ inputs.changelog }}
      submit_beta_review: ${{ inputs.submit_beta_review != false && inputs.submit_beta_review != 'false' }}
