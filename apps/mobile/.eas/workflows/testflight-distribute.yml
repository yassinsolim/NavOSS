name: TestFlight distribution

# App Store Connect uploads trigger distribution to the existing beta groups. This also covers
# builds uploaded outside GitHub Actions, without building a new binary for every source commit.
# The project's App Store Connect connection must be enabled in EAS settings.
#
# Manual dispatch remains available to recover a missed upload event or change What to Test notes:
#   eas workflow:run .eas/workflows/testflight-distribute.yml \
#     -F asc_build_id=<id> -F changelog="..."

on:
  app_store_connect:
    build_upload:
      states:
        - complete
      if: ${{ app_store_connect.app.id == '6792619727' && app_store_connect.build_upload.build.id }}
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: App Store Connect build id to distribute.
      changelog:
        type: string
        required: true
        description: What to Test notes shown to TestFlight testers.

jobs:
  distribute:
    name: Distribute to NavOSS Friends
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id || app_store_connect.build_upload.build.id }}
      # The internal `testers` group already has automatic distribution enabled in Apple.
      external_groups:
        - NavOSS Friends
      changelog: ${{ inputs.changelog || 'Please test place search, route previews, and navigation. Test CarPlay only while parked or passenger-operated. Report issues through TestFlight.' }}
      submit_beta_review: true
