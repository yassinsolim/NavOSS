# Replace <tunnel-id> with the tunnel's ID when installing this on a host.
tunnel: <tunnel-id>
credentials-file: /etc/cloudflared/<tunnel-id>.json
metrics: 127.0.0.1:2000
no-autoupdate: true

ingress:
  - hostname: navoss-api.yassin.app
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 10s
      noHappyEyeballs: false
  - service: http_status:404
